name: Release

# `v*` 태그를 푸시하면 Apple 공증(notarization)된 빌드를 릴리즈한다.
#   예: git tag v1.2.0 && git push origin v1.2.0
# workflow_dispatch(수동 실행)는 릴리즈 없이 빌드만 검증한다.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-14
    env:
      # 서명/공증 시크릿 (Settings → Secrets → Actions 에 등록)
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      APP_NAME: "Port Killer"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 릴리즈 노트 changelog 를 위해 전체 히스토리/태그 필요

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Show versions
        run: swift --version && xcodebuild -version

      - name: Build .app bundle
        run: ./make_app.sh

      - name: Determine version & release mode
        id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"          # 예: v1.2.0
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            # 수동 실행: 최신 태그로 빌드만 (릴리즈/태그 생성 안 함)
            TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "▶ tag=$TAG version=${TAG#v}"

      # ---- 코드 서명 (Developer ID Application) ----
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KPW="${KEYCHAIN_PASSWORD:-ci-$RANDOM$RANDOM}"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"

          # Apple 중간 인증서 설치 (체인 검증 → 아이덴티티가 valid 로 인식되도록)
          for url in \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer ; do
            f="$RUNNER_TEMP/$(basename "$url")"
            curl -fsSL -o "$f" "$url" && security import "$f" -k "$KEYCHAIN" 2>/dev/null || true
          done

          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          # 검색 목록에 빌드 키체인 추가 (기존 항목 유지)
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          echo "▶ 진단:"
          echo "   전체 아이덴티티(인증서+개인키): $(security find-identity -v "$KEYCHAIN" | tail -1)"
          echo "   코드사인 유효 아이덴티티:       $(security find-identity -v -p codesigning "$KEYCHAIN" | tail -1)"

          # Developer ID Application 아이덴티티 해시 검출 (valid 우선, 없으면 invalid 포함 재시도)
          SIGN_ID=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/{print $2; exit}')
          if [ -z "$SIGN_ID" ]; then
            SIGN_ID=$(security find-identity -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/{print $2; exit}')
          fi
          if [ -z "$SIGN_ID" ]; then
            echo "::error::Developer ID Application 아이덴티티를 찾지 못했습니다. 위 진단에서 '전체 아이덴티티'가 0 valid 이면 .p12 에 개인키가 빠진 것이고(키체인에서 인증서를 펼쳐 개인키까지 함께 선택해 내보내기), 0 이 아니면 인증서 종류가 Developer ID Application 이 아닙니다."
            exit 1
          fi
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PW=$KPW" >> "$GITHUB_ENV"
          echo "SIGN_ID=$SIGN_ID" >> "$GITHUB_ENV"

      - name: Codesign app (hardened runtime)
        if: env.MACOS_CERTIFICATE_BASE64 != ''
        run: |
          set -euo pipefail
          APP="build/${APP_NAME}.app"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # 검출된 아이덴티티 해시로 서명 (이름 문자열에 의존하지 않음)
          codesign --force --deep --timestamp --options runtime \
            --sign "$SIGN_ID" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      # ---- 공증 (notarytool) ----
      - name: Notarize & staple
        if: env.MACOS_CERTIFICATE_BASE64 != '' && env.NOTARY_KEY_BASE64 != ''
        run: |
          set -euo pipefail
          APP="build/${APP_NAME}.app"
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      # ---- 배포 아티팩트 생성 (zip + 스타일 dmg) ----
      - name: Package artifacts
        id: pkg
        run: |
          set -euo pipefail
          APP="build/${APP_NAME}.app"
          V="${{ steps.ver.outputs.version }}"
          ZIP="build/PortKiller-${V}.zip"
          DMG="build/PortKiller-${V}.dmg"
          ditto -c -k --keepParent "$APP" "$ZIP"
          # 배경/레이아웃이 적용된 설치용 DMG
          Tools/make_dmg.sh "$APP" "$DMG" "$APP_NAME"
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "dmg_sha256=$SHA" >> "$GITHUB_OUTPUT"

      # ---- 릴리즈 노트 자동 생성 (직전 태그 이후 커밋) ----
      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          # 현재 태그 직전의 태그 (없으면 첫 릴리즈)
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          NOTES_FILE="$RUNNER_TEMP/notes.md"
          {
            echo "## Port Killer $V"
            echo ""
            echo "### Changes"
            if [ -n "$PREV" ]; then
              git log "${PREV}..${TAG}" --no-merges --pretty='- %s (%h)' | grep -v -i 'Co-Authored-By' || echo "- (변경 사항 없음)"
              echo ""
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            else
              git log "${TAG}" --no-merges --pretty='- %s (%h)' | grep -v -i 'Co-Authored-By' || echo "- 첫 릴리즈"
            fi
            echo ""
            echo "### 설치"
            echo '```bash'
            echo "brew install --cask kingsfavor/tap/port-killer"
            echo '```'
            echo "또는 아래 \`.dmg\` 를 받아 앱을 Applications 로 드래그하세요."
            if [ -z "${MACOS_CERTIFICATE_BASE64}" ] || [ -z "${NOTARY_KEY_BASE64}" ]; then
              echo ""
              echo "> ⚠️ 이 빌드는 Apple 공증이 적용되지 않았습니다. 실행 시 우클릭 → 열기가 필요할 수 있습니다."
            fi
          } > "$NOTES_FILE"
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Signing status note
        run: |
          if [ -z "${MACOS_CERTIFICATE_BASE64}" ]; then
            echo "::warning::서명 시크릿이 없어 서명되지 않은 빌드를 릴리즈합니다. 공증 릴리즈를 원하면 docs/SECRETS.md 의 시크릿을 등록하세요."
          elif [ -z "${NOTARY_KEY_BASE64}" ]; then
            echo "::warning::서명은 되었으나 공증 시크릿(NOTARY_*)이 없어 공증을 건너뜁니다."
          else
            echo "서명 + 공증 완료 빌드입니다."
          fi

      - name: Create GitHub Release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          # 태그는 이미 푸시되어 존재하므로 해당 태그로 릴리즈 생성
          gh release create "$TAG" \
            "${{ steps.pkg.outputs.dmg }}" \
            "${{ steps.pkg.outputs.zip }}" \
            --title "Port Killer $V" \
            --notes-file "${{ steps.notes.outputs.file }}" \
            --latest

      # ---- Homebrew Cask 자동 업데이트 (별도 tap 리포에 push) ----
      - name: Update Homebrew tap
        if: steps.ver.outputs.release == 'true' && env.TAP_GITHUB_TOKEN != ''
        env:
          TAP_REPO: KingsFavor/homebrew-tap
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          SHA="${{ steps.pkg.outputs.dmg_sha256 }}"
          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/${TAP_REPO}.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          cat > "$RUNNER_TEMP/tap/Casks/port-killer.rb" <<CASK
          cask "port-killer" do
            version "${V}"
            sha256 "${SHA}"

            url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/PortKiller-#{version}.dmg"
            name "Port Killer"
            desc "Menu bar tool to view and kill processes holding developer ports"
            homepage "https://github.com/${GITHUB_REPOSITORY}"

            app "Port Killer.app"

            zap trash: [
              "~/Library/Preferences/com.portkiller.app.plist",
            ]
          end
          CASK
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/port-killer.rb
          git commit -m "port-killer ${V}" || { echo "변경 없음"; exit 0; }
          git push
